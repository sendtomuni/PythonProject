<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date and Time Lab</title>
<style>
:root{--bg:#fff;--fg:#172b4d;--mute:#5e6c84;--line:#dfe1e6;--card:#f4f5f7;--chg:#fff0b3;--new:#abf5d1;--hl:#deebff;--acc:#0052cc;--err:#ffebe6}
@media (prefers-color-scheme:dark){:root{--bg:#1d2125;--fg:#dee4ea;--mute:#9fadbc;--line:#3b444c;--card:#22272b;--chg:#7f5f01;--new:#216e4e;--hl:#09326c;--acc:#579dff;--err:#5d1f1a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line)}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:12px;padding:12px 16px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.rail button{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer;font:inherit}
.rail button.on{border-color:var(--acc);outline:2px solid var(--acc)}.rail small{display:block;color:var(--mute)}
.panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.panel h3{margin:0 0 6px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.code div{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:0 6px;border-radius:4px;white-space:pre}
.code .nx{background:var(--hl);outline:1px solid var(--acc)}.code .dn{color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.ctl button,.ctl select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.ctl button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.note{border-left:4px solid var(--acc);padding:6px 10px;background:var(--bg);border-radius:4px;min-height:34px}
.obj{display:inline-block;margin:0 10px 10px 0;vertical-align:top}.obj b{font-size:12px;color:var(--mute)}
.cells{display:flex;gap:0}.cell{min-width:44px;border:1px solid var(--fg);padding:2px 6px;text-align:center;background:var(--bg);font:13px ui-monospace,Menlo,monospace}
.cell i{display:block;font:11px system-ui;color:var(--mute);font-style:normal}.cell.chg{background:var(--chg)}.cell.new{background:var(--new)}
.cell.mid{background:var(--chg)}.cell.rng{background:var(--hl)}.cell.out{opacity:.45}
.vars span{display:inline-block;margin:0 12px 6px 0;font:13px ui-monospace,Menlo,monospace}
pre.out{margin:0;font:13px ui-monospace,Menlo,monospace;min-height:20px;white-space:pre-wrap}
svg text{font:12px ui-monospace,Menlo,monospace;fill:var(--fg)}
</style></head><body>
<header><h1>Date and Time Lab</h1><p>Companion to the Confluence page: <b>Python Date and Time - Complete Guide</b>. Press Space or the right arrow to run one line.</p></header>
<div class="wrap"><nav class="rail" id="rail"></nav><main>
<div class="ctl"><button class="p" id="nx">▶ Run line</button><button id="bk">◀ Back</button><button id="rs">⟲ Reset</button><button id="au">⏯ Auto</button>
<label>Speed <select id="sp"><option value="1800">Slow</option><option value="1100" selected>Normal</option><option value="600">Fast</option></select></label><span id="pos" style="color:var(--mute)"></span></div>
<div class="panel"><h3 id="ttl">Code</h3><div class="code" id="code"></div></div>
<div class="note" id="note"></div><div style="height:10px"></div>
<div class="panel" id="vz"><h3>Memory</h3><div class="vars" id="vars"></div><div id="objs"></div></div>
<div class="panel" id="hp" style="display:none"><h3>Heap as a tree (parent is never bigger than its children)</h3><div id="tree"></div></div>
<div class="panel"><h3>Output</h3><pre class="out" id="out"></pre></div>
</main></div>

let si=0,pos=0,timer=null;const $=id=>document.getElementById(id);
function sc(){return DATA[si]}
function nsteps(){return sc().steps.length}
function stateAt(p){const s=sc().steps;if(sc().kind==='probe')return null;if(p===0)return s[0].before;return s[p-1].after}
function show(c){return c.ref?'→'+c.ref:c.r}
function sig(h){return h?JSON.stringify([h.keys||null,h.items]):''}
function render(){
 const S=sc(),n=nsteps();$('ttl').textContent=S.title;$('pos').textContent='step '+pos+' / '+n;
 $('rail').innerHTML='';DATA.forEach((d,i)=>{const b=document.createElement('button');b.className=i===si?'on':'';b.innerHTML=d.title+'<small>'+d.section+'</small>';b.onclick=()=>{stop();si=i;pos=0;render()};$('rail').appendChild(b)});
 if(S.kind==='probe')return renderProbe(S);
 $('hp').style.display=S.view==='heap'?'block':'none';
 const cur=stateAt(pos),prev=pos>0?S.steps[pos-1].before:cur;
 $('code').innerHTML=S.code.map((l,i)=>{const nxl=pos<n&&S.steps[pos].line===i+1;const done=S.steps.slice(0,pos).some(s=>s.line===i+1);return '<div class="'+(nxl?'nx':done?'dn':'')+'">'+(nxl?'▶ ':'  ')+esc(l)+'</div>'}).join('');
 const k=pos>0?S.steps[pos-1].line:0;$('note').textContent=pos===0?(S.blurb+' Press Run line.'):(S.notes&&S.notes[k]||'');
 let vh='',oh='';const seen=new Set();
 for(const [name,c] of Object.entries(cur.vars)){const was=prev.vars[name];vh+='<span style="'+(!was?'background:var(--new)':JSON.stringify(was)!==JSON.stringify(c)?'background:var(--chg)':'')+'">'+name+' = '+show(c)+'</span>'}
 for(const [id,h] of Object.entries(cur.heap)){const ph=prev.heap[id];const names=Object.entries(cur.vars).filter(([a,c])=>c.ref===id).map(a=>a[0]).join(', ');
  oh+='<div class="obj"><b>'+id+' '+h.label+(names?' ('+names+')':'')+'</b><div class="cells">'+h.items.map((c,i)=>{const pc=ph&&ph.items[i];const cls=!ph||(h.keys?false:i>=ph.items.length)||(h.keys&&ph.keys.indexOf(h.keys[i])<0)?'new':(pc&&JSON.stringify(pc)!==JSON.stringify(c)?'chg':(h.keys&&ph&&JSON.stringify(ph.items[ph.keys.indexOf(h.keys[i])])!==JSON.stringify(c)?'chg':''));
  return '<div class="cell '+(ph?cls:'new')+'"><i>'+(h.keys?esc(h.keys[i]):i)+'</i>'+esc(show(c))+'</div>'}).join('')+(h.items.length?'':'<span style="color:var(--mute)">empty</span>')+'</div></div>'}
 $('vars').innerHTML=vh||'<span style="color:var(--mute)">no variables yet</span>';$('objs').innerHTML=oh;
 $('out').textContent=S.steps.slice(0,pos).map(s=>s.out).join('');
 if(S.view==='heap')tree(cur,prev,S.heapvar);
 $('nx').disabled=pos>=n;$('bk').disabled=pos<=0;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function tree(cur,prev,v){const c=cur.vars[v];if(!c){$('tree').innerHTML='<span style="color:var(--mute)">no heap yet</span>';return}
 const a=cur.heap[c.ref].items.map(x=>x.r);const pc=prev.vars[v];const pa=pc?prev.heap[pc.ref].items.map(x=>x.r):[];
 if(!a.length){$('tree').innerHTML='<span style="color:var(--mute)">empty heap</span>';return}
 const lv=Math.floor(Math.log2(a.length))+1,W=Math.max(360,Math.pow(2,lv-1)*52),H=lv*56+10;let g='';
 const P=i=>{const l=Math.floor(Math.log2(i+1)),k=i+1-Math.pow(2,l);return [W*(k+.5)/Math.pow(2,l),28+l*56]};
 a.forEach((x,i)=>{if(i>0){const [x1,y1]=P(Math.floor((i-1)/2)),[x2,y2]=P(i);g+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="currentColor" opacity=".4"/>'}});
 a.forEach((x,i)=>{const [px,py]=P(i);const f=i>=pa.length?'var(--new)':pa[i]!==x?'var(--chg)':'var(--bg)';g+='<circle cx="'+px+'" cy="'+py+'" r="18" fill="'+f+'" stroke="currentColor"/><text x="'+px+'" y="'+(py+4)+'" text-anchor="middle">'+x+'</text><text x="'+px+'" y="'+(py-21)+'" text-anchor="middle" opacity=".6" style="font-size:10px">'+i+'</text>'});
 $('tree').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;color:var(--fg)">'+g+'</svg>'}
function renderProbe(S){$('hp').style.display='none';const n=S.steps.length,st=S.steps[Math.max(0,pos-1)];
 $('code').innerHTML='<div>list = '+JSON.stringify(S.list)+'    x = '+S.x+'</div><div>while lo &lt; hi:  mid = (lo + hi) // 2  →  compare list[mid] with x</div>';
 $('note').textContent=pos===0?S.blurb+' Press Run line.':st.text;
 const lo=pos?st.lo:0,hi=pos?st.hi:S.list.length,mid=pos?st.mid:null;
 $('vars').innerHTML='<span>lo = '+lo+'</span><span>hi = '+hi+'</span><span>mid = '+(mid===null?'-':mid)+'</span>';
 $('objs').innerHTML='<div class="obj"><div class="cells">'+S.list.map((v,i)=>'<div class="cell '+(i===mid?'mid':(i>=lo&&i<hi?'rng':'out'))+'"><i>'+i+'</i>'+v+'</div>').join('')+'</div></div><div style="color:var(--mute);font-size:12px">blue = still in range, yellow = mid, faded = ruled out</div>';
 $('out').textContent=pos===n?'insertion position = '+st.lo:'';$('nx').disabled=pos>=n;$('bk').disabled=pos<=0}
function stop(){if(timer){clearInterval(timer);timer=null;$('au').textContent='⏯ Auto'}}
function next(){if(pos<nsteps()){pos++;render()}else stop()}
function back(){if(pos>0){pos--;render()}}
$('nx').onclick=()=>{stop();next()};$('bk').onclick=()=>{stop();back()};$('rs').onclick=()=>{stop();pos=0;render()};
$('au').onclick=()=>{if(timer){stop();return}if(pos>=nsteps())pos=0;$('au').textContent='⏸ Pause';render();timer=setInterval(next,+$('sp').value)};
$('sp').onchange=()=>{if(timer){stop();$('au').click()}};
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();stop();next()}else if(e.key==='ArrowLeft'){stop();back()}else if(e.key==='r'||e.key==='R'){stop();pos=0;render()}});
render();
</script></body></html>
