<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multithreading Lab</title>
<style>
:root{--bg:#f3f5f9;--surface:#fff;--sunk:#e9edf4;--line:#d5dbe6;--fg:#1b2333;--muted:#5d6779;--accent:#2747c9;--accent-fg:#fff;
--code-bg:#151b28;--code-fg:#dfe5f0;--code-muted:#6f7a8f;--hot:#f2b632;--hot-soft:#fff3d4;--ok:#1f9d6b;--ok-soft:#dcf5ea;--bad:#c73b2c;--bad-soft:#fde5e1;--wait:#7a3fc4;--wait-soft:#efe4fb;
--mono:ui-monospace,Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f131b;--surface:#171d29;--sunk:#1e2533;--line:#2c3547;--fg:#e6eaf2;--muted:#9aa4b7;--accent:#7f9bff;--accent-fg:#0f131b;
--code-bg:#0b0f16;--hot-soft:#3a3018;--ok-soft:#143327;--bad-soft:#3b1a16;--wait-soft:#2b2040}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}p.sub{margin:0 0 14px;color:var(--muted)}
.rail{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rail button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
.rail button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.blurb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
pre.code{margin:0;padding:10px 0;background:var(--code-bg);color:var(--code-fg);font:13px/1.55 var(--mono);overflow:auto}
pre.code div{padding:0 12px;white-space:pre}
pre.code div.on{background:#2747c9;color:#fff}
.lane{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}.lane b{font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--sunk)}
.chip.run{background:var(--hot-soft);border-color:var(--hot)}.chip.in{background:var(--ok-soft);border-color:var(--ok)}
.chip.blk{background:var(--bad-soft);border-color:var(--bad)}.chip.wt{background:var(--wait-soft);border-color:var(--wait)}
.obj{padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.slot{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:600 12px var(--mono)}
.slot.used{background:var(--bad-soft);border-color:var(--bad)}.slot.free{background:var(--ok-soft);border-color:var(--ok)}
.note{padding:10px 12px;min-height:56px}
.console{margin:0;padding:10px 12px;background:var(--code-bg);color:var(--code-fg);font:13px/1.5 var(--mono);min-height:60px;white-space:pre-wrap}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.ctl button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.ctl button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ctl button:disabled{opacity:.45;cursor:default}.ctl label{color:var(--muted);font-size:13px}
.step{color:var(--muted);font-size:13px}
</style></head><body><main>
<h1>Multithreading Lab</h1>
<p class="sub">Real event timelines recorded from the practice programs. Step through them at your own pace. Keys: Space or → next, ← back, R reset.</p>
<div class="rail" id="rail"></div>
<div class="blurb" id="blurb"></div>
<div class="ctl">
 <button id="back">◀ Back</button><button class="pri" id="next">Next ▶</button>
 <button id="play">▶ Play</button><button id="reset">↺ Reset</button>
 <label>Speed <input type="range" id="speed" min="1" max="5" value="3"></label><span class="step" id="stepno"></span>
</div>
<div class="grid">
 <div class="panel"><h2>Code (line that just ran is highlighted)</h2><pre class="code" id="code"></pre></div>
 <div>

 </div>
</div>

function sc(){return DATA[si]}
function stopPlay(){clearInterval(timer);timer=null;$('play').textContent='▶ Play'}

 const s=sc(),st=pos>=0?s.steps[pos]:null;

 $('lanes').innerHTML=s.threads.map(t=>{
  let cls='chip',txt='⚪ idle / not in the shared section';
  if(st){
   if(st.blocked.includes(t)&&s.kind!=='cond'){const imm=st.action==='acquire?'&&st.thread===t&&st.free>0;cls=imm?'chip run':'chip blk';txt=imm?'▶ calling acquire()':'⛔ blocked in acquire()'}
   else if(st.inside.includes(t)){cls='chip in';txt='🟢 inside, holds it'}
   else if(s.kind==='cond'){ if(st.notified.includes(t)){cls='chip run';txt='🔔 notified, needs the lock back'} else if(st.waiting.includes(t)){cls='chip wt';txt='💤 waiting in wait()'} else if(st.holder===t){cls='chip in';txt='🟢 holds the lock'} }
   if(st.thread===t&&pos>=0){txt+=' · just ran '+st.action}

 else{const n=s.n,used=st?st.inside.length:0;o=`<b>${s.kind==='lock'?'Lock':'Semaphore permits'}:</b> `+Array.from({length:n},(_,i)=>`<span class="slot ${i<used?'used':'free'}">${i<used?'in':'free'}</span>`).join('')+` &nbsp; <b>Waiting:</b> ${st&&st.blocked.filter(t=>!(st.action==='acquire?'&&st.thread===t&&st.free>0)).length?st.blocked.filter(t=>!(st.action==='acquire?'&&st.thread===t&&st.free>0)).join(', '):'nobody'}`}

function next(){if(pos<sc().steps.length-1){pos++;render()}else stopPlay()}
